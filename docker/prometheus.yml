global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules/config-backup-alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: netbox
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets: ["netbox:8080"]
        labels:
          service: netbox-config-backup

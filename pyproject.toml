[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "netbox-config-backup"
version = "0.5.0"
description = "A NetBox plugin for auditable network device configuration backups."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.15"
dependencies = [
  "asyncssh>=2.21,<3",
  "cryptography>=46,<51",
  "netmiko>=4.7,<5",
  "pyftpdlib>=2.1,<3",
  "scp>=0.16,<1",
  # NetBox/Django also install sqlparse. Keep the patched security release as
  # part of the plugin's reproducible runtime until the base image catches up.
  "sqlparse>=0.6,<1",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: Django",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
s3 = [
  "boto3>=1.40,<2",
]
vault = [
  "hvac>=2.4,<3",
]
test = [
  "coverage[toml]>=7.6",
]

[tool.setuptools.packages.find]
include = ["netbox_config_backup*"]

[tool.setuptools.package-data]
netbox_config_backup = ["templates/**/*.html"]

[tool.coverage.run]
branch = true
source = ["netbox_config_backup"]
omit = [
  "netbox_config_backup/choices.py",
  "netbox_config_backup/config.py",
  "netbox_config_backup/migrations/*",
  "netbox_config_backup/models.py",
  "netbox_config_backup/navigation.py",
  "netbox_config_backup/services/django_repository.py",
  "netbox_config_backup/urls.py",
  "netbox_config_backup/views.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
exclude = ["netbox_config_backup/migrations", "tmp"]

[tool.ruff.lint]
# Windows bind mounts appear executable inside Linux containers even when the
# source files are ordinary Python modules. EXE002 is therefore not portable
# for this project's supported development workflow.
ignore = ["EXE002"]

[tool.ruff.lint.per-file-ignores]
"netbox_config_backup/config.py" = ["RUF012"]
"netbox_config_backup/migrations/*.py" = ["RUF012"]
"tests/test_retention.py" = ["DTZ001"]
